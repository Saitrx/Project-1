<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Animation</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0c18;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      margin: 0;
      padding: 0 16px;
      text-align: center;
      font: 14px system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <p class="hint">Move your mouse to push the particles · click to add more</p>
  <script src="animation.js"></script>
</body>
</html>
